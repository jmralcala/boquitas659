name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # TODO: fija cada action por SHA de commit (ver TOOLS.md).
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
        if: ${{ hashFiles('package-lock.json') != '' }}
      - name: Instalar y verificar
        run: |
          if [ ! -f package-lock.json ]; then
            echo "::warning::No hay package-lock.json: se omite el CI. Si usas pnpm o yarn, adapta este workflow."
            exit 0
          fi
          npm ci
          npm run lint --if-present
          npm run typecheck --if-present
          npm run test --if-present
          npm run build --if-present
