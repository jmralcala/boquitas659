name: Security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      # TODO: fija por SHA. Nota: gitleaks-action puede requerir licencia en repos de organización.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Auditar dependencias
        run: |
          if [ -f package-lock.json ]; then
            npm ci
            npm audit --audit-level=high
          else
            echo "::warning::No hay package-lock.json: se omite la auditoría de dependencias. Si usas pnpm o yarn, adapta este job."
          fi

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      # CodeQL falla si no encuentra código de aplicación que analizar.
      # Se excluyen .claude/ (hooks), .github/ y node_modules/.
      - name: Detectar código JS/TS analizable
        id: detect
        run: |
          if git ls-files -- '*.ts' '*.tsx' '*.js' '*.jsx' '*.mjs' '*.cjs' ':!.claude' ':!.github' ':!node_modules' | grep -q .; then
            echo "has_code=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_code=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No hay código JS/TS de aplicación: se omite CodeQL."
          fi
      - if: steps.detect.outputs.has_code == 'true'
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - if: steps.detect.outputs.has_code == 'true'
        uses: github/codeql-action/analyze@v3
